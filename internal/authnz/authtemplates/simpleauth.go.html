{{/*gotype: github.com/freifunkMUC/wg-access-server/pkg/authnz/authtemplates.SimpleAuthPage*/ -}}
{{- define "body" -}}
<section class="form">
	<h2>Sign in</h2>

	<form action="{{.PostURL}}" method="POST">
		<label for="username">Username</label>
		<input type="text" name="username" id="username" autocomplete="username" autofocus required>
		<label for="password">Password</label>
		<input type="password" name="password" id="password" autocomplete="current-password" required>
		<button id="submit" type="submit">Sign in</button>
	</form>
	{{- with .ErrorMessage}}
	<div class="error" role="alert">{{.}}</div>
	{{- end}}
	{{- if .OtherProviders}}
	<a class="back" href="/signin">Other ways to sign in</a>
	{{- end}}

	{{template "footer"}}
</section>
{{- end}}
