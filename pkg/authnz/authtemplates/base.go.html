<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign in · wg-access-server</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
    * {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        box-sizing: border-box;
    }

    body {
        background: linear-gradient(135deg, #3899c9 0%, #165a7d 100%);
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .form {
        background-color: #ffffff;
        width: 100%;
        max-width: 400px;
        padding: 2.5rem;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        margin: 1rem;
    }

    .form h2 {
        margin: 0 0 1.5rem;
        text-align: center;
        color: #1a1a1a;
        font-size: 1.75rem;
        font-weight: 600;
    }

    .form input {
        width: 100%;
        padding: 0.75rem 1rem;
        margin: 0.5rem 0 1rem;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 1rem;
        transition: all 0.3s ease;
    }

    .form label {
        color: #666;
        font-size: 0.9rem;
        font-weight: 500;
    }

    .form button,
    .form a.provider {
        width: 100%;
        padding: 0.75rem;
        border: none;
        border-radius: 8px;
        background: #3899c9;
        color: white;
        font-size: 1rem;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.3s ease;
        margin: 0.5rem 0;
    }

    .form button:hover,
    .form a.provider:hover {
        background: #2d7aa3;
        transform: translateY(-1px);
    }

    /* a link that looks like the buttons: no underline, no link colours */
    .form a.provider {
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        text-decoration: none;
    }

    .form a.provider img {
        position: absolute;
        left: 0.75rem;
        height: 1.125rem;
        width: 1.125rem;
    }

    .form input:focus {
        outline: none;
        border-color: #3899c9;
    }

    /* keyboard users need to see where they are */
    .form button:focus-visible,
    .form a:focus-visible {
        outline: 3px solid #165a7d;
        outline-offset: 2px;
    }

    .form .back {
        display: block;
        margin-top: 1rem;
        text-align: center;
        color: #2d7aa3;
        font-size: 0.9rem;
    }

    .form .error {
        color: #dc3545;
        font-size: 0.9rem;
        margin-top: 1rem;
        text-align: center;
    }

    @media (prefers-color-scheme: dark) {
        .form {
            background-color: #1a1a1a;
        }

        .form h2 {
            color: #ffffff;
        }

        .form input {
            background-color: #333;
            border-color: #444;
            color: #ffffff;
        }

        .form input:focus {
            border-color: #3899c9;
            background-color: #2a2a2a;
        }

        .form label {
            color: #e0e0e0;
        }

        .form button:focus-visible,
        .form a:focus-visible {
            outline-color: #8cc8e6;
        }

        .form .back {
            color: #8cc8e6;
        }

        .form .error {
            color: #ff8a8a;
        }

    }
    </style>
</head>
<body>
{{block "body" .}}{{end}}
</body>
</html>
