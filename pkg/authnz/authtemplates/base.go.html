<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign in · wg-access-server</title>

    <style>
    * {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        box-sizing: border-box;
    }

    body {
        background: linear-gradient(135deg, #3899c9 0%, #165a7d 100%);
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .page {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        padding: 1rem;
    }

    /* the name and key of the web UI's app bar, so both look like one thing */
    .brand {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 1.25rem;
        color: #ffffff;
        font-size: 1.35rem;
        font-weight: 600;
    }

    .form {
        background-color: #ffffff;
        width: 100%;
        max-width: 400px;
        padding: 2.5rem;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    }

    .form footer {
        margin-top: 1.75rem;
        padding-top: 1rem;
        border-top: 1px solid #eeeeee;
        text-align: center;
        font-size: 0.8rem;
        color: #888888;
    }

    .form footer a {
        color: #2d7aa3;
        text-decoration: none;
    }

    .form footer a:hover {
        text-decoration: underline;
    }

    .form footer svg {
        vertical-align: -2px;
        margin-right: 2px;
    }

    .form h2 {
        margin: 0 0 1.5rem;
        text-align: center;
        color: #1a1a1a;
        font-size: 1.75rem;
        font-weight: 600;
    }

    .form input {
        width: 100%;
        padding: 0.75rem 1rem;
        margin: 0.5rem 0 1rem;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 1rem;
        transition: all 0.3s ease;
    }

    .form label {
        color: #666;
        font-size: 0.9rem;
        font-weight: 500;
    }

    .form button,
    .form a.provider {
        width: 100%;
        padding: 0.75rem;
        border: none;
        border-radius: 8px;
        background: #3899c9;
        color: white;
        font-size: 1rem;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.3s ease;
        margin: 0.5rem 0;
    }

    .form button:hover,
    .form a.provider:hover {
        background: #2d7aa3;
        transform: translateY(-1px);
    }

    /* a link that looks like the buttons: no underline, no link colours */
    .form a.provider {
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        text-decoration: none;
    }

    .form a.provider img {
        position: absolute;
        left: 0.75rem;
        height: 1.125rem;
        width: 1.125rem;
    }

    .form input:focus {
        outline: none;
        border-color: #3899c9;
    }

    /* keyboard users need to see where they are */
    .form button:focus-visible,
    .form a:focus-visible {
        outline: 3px solid #165a7d;
        outline-offset: 2px;
    }

    .form .back {
        display: block;
        margin-top: 1rem;
        text-align: center;
        color: #2d7aa3;
        font-size: 0.9rem;
    }

    .form .error {
        color: #dc3545;
        font-size: 0.9rem;
        margin-top: 1rem;
        text-align: center;
    }

    @media (prefers-color-scheme: dark) {
        .form {
            background-color: #1a1a1a;
        }

        .form h2 {
            color: #ffffff;
        }

        .form input {
            background-color: #333;
            border-color: #444;
            color: #ffffff;
        }

        .form input:focus {
            border-color: #3899c9;
            background-color: #2a2a2a;
        }

        .form label {
            color: #e0e0e0;
        }

        .form button:focus-visible,
        .form a:focus-visible {
            outline-color: #8cc8e6;
        }

        .form .back {
            color: #8cc8e6;
        }

        .form .error {
            color: #ff8a8a;
        }

        .form footer {
            border-color: #333333;
            color: #999999;
        }

        .form footer a {
            color: #8cc8e6;
        }

    }
    </style>
</head>
<body>
<main class="page">
    <div class="brand">
        <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path fill="currentColor" d="M12.65 10C11.83 7.67 9.61 6 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6c2.61 0 4.83-1.67 5.65-4H17v4h4v-4h2v-4zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2"/></svg>
        wg-access-server
    </div>
    {{block "body" .}}{{end}}
</main>
</body>
</html>
