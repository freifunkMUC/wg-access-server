# wg-access-server with Docker Compose. More setups - behind Traefik, IPv4- or
# IPv6-only, with Docker secrets - are in docs/deployment/2-docker-compose.md.
services:
  wg-access-server:
    image: ghcr.io/freifunkmuc/wg-access-server:latest
    # to build the image from source instead:
    # build: .
    container_name: wg-access-server
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 0
      net.ipv6.conf.all.forwarding: 1
    volumes:
      - "wg-access-server-data:/data"
      # - "./config.yaml:/config.yaml:ro" # an optional config file
    environment:
      WG_ADMIN_PASSWORD: "${WG_ADMIN_PASSWORD:?set WG_ADMIN_PASSWORD, the password of the admin account}"
      WG_WIREGUARD_PRIVATE_KEY: "${WG_WIREGUARD_PRIVATE_KEY:?set WG_WIREGUARD_PRIVATE_KEY, e.g. to the output of wg genkey}"
    ports:
      - "8443:8443/tcp" # the web UI, over HTTPS with a self-signed certificate
      - "127.0.0.1:8000:8000/tcp" # the web UI over plain HTTP - only for this machine
      - "51820:51820/udp" # WireGuard
    devices:
      - "/dev/net/tun:/dev/net/tun"

volumes:
  wg-access-server-data:
