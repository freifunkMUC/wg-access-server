syntax = "proto3";

package proto;

option go_package = "github.com/freifunkMUC/wg-access-server/proto/proto";

import "google/protobuf/wrappers.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

service Devices {
  rpc AddDevice(AddDeviceReq) returns (Device) {}
  rpc ListDevices(ListDevicesReq) returns (ListDevicesRes) {}
  rpc DeleteDevice(DeleteDeviceReq) returns (google.protobuf.Empty) {}
  rpc RenameDevice(RenameDeviceReq) returns (Device) {}

  // admin only
  rpc ListAllDevices(ListAllDevicesReq) returns (ListAllDevicesRes) {}
  // SetDeviceAccess blocks a device from connecting, or gives it an expiry
  // date. It is admin only: a user must not be able to lift a block or
  // extend the expiry an admin set on their device.
  rpc SetDeviceAccess(SetDeviceAccessReq) returns (Device) {}
}

message Device {
  string name = 1;
  string owner = 2;
  string public_key = 3;
  string address = 4;
  google.protobuf.Timestamp created_at = 5;
  bool connected = 6;
  google.protobuf.Timestamp last_handshake_time = 7;
  int64 receive_bytes = 8;
  int64 transmit_bytes = 9;
  string endpoint = 10;
  string owner_name = 11;
  string owner_email = 12;
  string owner_provider = 13;
  string preshared_key = 14;
  // disabled: an admin blocked the device, so it has no WireGuard peer and
  // cannot connect until the block is lifted.
  bool disabled = 15;
  // unset: the device's access does not expire. Once the time has passed the
  // device loses its peer, like a disabled one.
  google.protobuf.Timestamp expires_at = 16;
}

message AddDeviceReq {
  string name = 1;
  string public_key = 2;
  string preshared_key = 3;
  bool manual_ip_assignment = 4;
  string manual_ipv4_address = 5;
  string manual_ipv6_address = 6;
}

message RenameDeviceReq {
  string name = 1;
  string new_name = 2;
  // admin only: rename a device of another user
  google.protobuf.StringValue owner = 3;
}

message ListDevicesReq {

}

message ListDevicesRes {
  repeated Device items = 1;
}

message DeleteDeviceReq {
  string name = 1;

  // admin's may delete a device owned
  // by someone other than the current user
  // if empty, defaults to the current user
  google.protobuf.StringValue owner = 2;
}

message ListAllDevicesReq {

}

message ListAllDevicesRes {
  repeated Device items = 1;
}

// SetDeviceAccessReq changes whether a device may connect. Both changes are
// optional, so one of them can be made without reading and sending back the
// other - two admins working at once then cannot undo each other's change.
message SetDeviceAccessReq {
  string name = 1;
  // if empty, defaults to the current user
  google.protobuf.StringValue owner = 2;
  // unset: leave the block as it is
  google.protobuf.BoolValue disabled = 3;
  // unset: leave the expiry as it is. Must be in the future - to end access
  // now, disable the device.
  google.protobuf.Timestamp expires_at = 4;
  // true: the device's access no longer expires. Takes precedence over
  // expires_at.
  bool clear_expires_at = 5;
}
