syntax = "proto3";

package proto;

option go_package = "github.com/freifunkMUC/wg-access-server/proto/proto";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service Users {
  // admin only
  rpc ListUsers(ListUsersReq) returns (ListUsersRes) {}
  rpc DeleteUser (DeleteUserReq) returns (google.protobuf.Empty) {}
}

message User {
  string name = 1;
  string displayName = 2;
  // unset: the server has not seen them sign in
  google.protobuf.Timestamp last_login = 3;
  // the access policies their identity provider put them in at that login.
  // Empty: their devices may reach what vpn.allowedIPs says.
  repeated string policies = 4;
}

message ListUsersReq {

}

message ListUsersRes {
  repeated User items = 1;
}

message DeleteUserReq {
  string name = 1;
}
